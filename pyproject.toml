[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-pulseloss"
version = "0.1.1"
description = "Pure-Python magnetic-field, strand-diffusion, multifilament FEM, and loss-surrogate tools for pulsed solenoids."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "hery rainforeset"}]
keywords = ["pulsed magnet", "eddy current", "magnetic diffusion", "finite element", "superconducting cable", "aluminum"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[project.scripts]
apexloss = "apexloss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"apexloss.data" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: computationally heavier regression tests"]
